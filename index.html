// Override parseUnifiedData with improved parser
parseUnifiedData=function(rows){
var priorities=[],cur=null;
for(var i=0;i<rows.length;i++){
var r=rows[i];if(!r||!r.length)continue;
var j=r.join(' ');
if(j.match(/Priority #\d/)&&r[1]&&r[1].indexOf('Priority #')===0&&!r[4]){
var pn=j.match(/Priority #(\d+)/);if(!pn)continue;
cur={id:'p'+pn[1],num:parseInt(pn[1]),name:r[1].replace(/^Priority #\d+:\s*/,''),whyNow:'',owner:'',readiness:'',fitScore:'',compRisk:'',nextAction:'',initiatives:[],extraContacts:''};
priorities.push(cur);continue}
if(cur&&r[1]&&r[1]==='Priority #'+cur.num&&r[2]){
cur.whyNow=(r[2]||'').replace(/\n/g,' ').substring(0,300);
cur.owner=(r[3]||'').split('\n')[0];
cur.readiness=(r[14]||'');cur.fitScore=(r[15]||'');cur.compRisk=(r[16]||'');cur.nextAction=(r[17]||'')}
if(cur&&(r[4]||r[11])){
if(!r[4]&&r[11]&&r[11].indexOf('NEW ')===0){cur.extraContacts=r[11];continue}
var init={product:(r[4]||'').replace(/\n/g,' '),budget:(r[5]||'').replace(/\n/g,' '),timeline:(r[6]||'').replace(/\n/g,' '),team:(r[7]||'').replace(/\n/g,' '),type:r[8]||'',vendors:(r[9]||'').replace(/\n/g,' '),fit:(r[10]||'').replace(/\n/g,' '),contact:r[11]||'',title:r[12]||'',role:r[13]||'',linkedin:r[14]||''};
if(init.product||init.contact)cur.initiatives.push(init)}}
return priorities};
